name: YouTube Auto Digest to Telegram

on:
  schedule:
    # 每天定時執行（例如 UTC 0:00，即台灣時間早上 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許在 GitHub 介面手動按按鈕測試執行

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予 GitHub Actions 寫入權限，用來 commit 更新 json 檔

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update processed_videos.json [skip ci]" && git push)
